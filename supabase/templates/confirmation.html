<!--
  Confirm-signup email: branded, CODE + LINK.

  Why both: with "Confirm email" ON (production), Supabase sends a BRAND-NEW
  user this template instead of Magic Link, for BOTH ways in:
    - passwordless sign-in (signInWithOtp): the user types the CODE on the
      sign-in screen (src/login/EmailCodeStep.tsx)
    - password Register (signUp): the user taps the LINK, which lands on /confirm
      (src/login/EmailConfirmation.tsx reads ?token=<hash>&type=signup)
  One email serves both, so neither flow dead-ends.

  LOCAL template (wired via config.toml `content_path`). Production's "Confirm
  signup" template is set in the Supabase dashboard; paste this whole file there
  (see docs/ops/mxroute-production-email.md, Step 5).

  {{ .Token }}     = the 6-digit code.
  {{ .TokenHash }} = the hashed token the /confirm page verifies.
  {{ .SiteURL }}   = the configured site_url (logo + link resolve per environment).

  Email HTML note: clients (Gmail/Outlook) ignore modern CSS, so this uses
  table layout + inline styles, matching magic_link.html.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#f6f7f8;padding:24px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:480px;background:#ffffff;border-radius:12px;border:1px solid #e6e8ea;">
        <tr>
          <td align="center" style="padding:28px 24px 8px;">
            <img src="{{ .SiteURL }}/logo-main.png" alt="Rack'em Leagues" height="44"
                 style="height:44px;width:auto;display:block;border:0;" />
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 0;color:#1a1a1a;">
            <h1 style="font-size:20px;margin:16px 0 4px;text-align:center;">Welcome to Rack'em</h1>
            <p style="font-size:15px;color:#555;text-align:center;margin:0 0 20px;">
              If you're on the sign-in screen, enter this code:
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 32px;">
            <div style="display:inline-block;background:#f0f8fb;border:1px solid #50a6c2;border-radius:10px;padding:16px 28px;font-size:32px;font-weight:700;letter-spacing:8px;color:#0a3a47;">
              {{ .Token }}
            </div>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 32px 0;">
            <p style="font-size:15px;color:#555;margin:0 0 12px;">Or confirm your email with this button:</p>
            <a href="{{ .SiteURL }}/confirm?token={{ .TokenHash }}&type=signup"
               style="display:inline-block;background:#0a3a47;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 24px;border-radius:8px;">
              Confirm my email
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 0;">
            <p style="font-size:13px;color:#888;text-align:center;margin:0;">
              This code and button expire in 1 hour. If you didn't sign up, you can ignore this email.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 28px;">
            <p style="font-size:12px;color:#aaa;text-align:center;margin:16px 0 0;border-top:1px solid #eee;padding-top:16px;">
              Rack'em Leagues
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
