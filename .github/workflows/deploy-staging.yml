# =====================================================================
# Staging deploy targets — pinned in YAML, NOT secrets.
# These values are public information (they appear in OAuth callback URLs,
# the staging JS bundle, and the dashboard URL bar). Keeping them in code
# instead of GitHub Environment secrets means:
#   - a project_ref change is a reviewable PR, not a silent UI click
#   - prod vs staging cross-wiring is impossible to do by accident
#
# True credentials (DB password, anon key, AWS creds, Supabase access
# token) still live in the `staging` GitHub Environment secrets.
#
#   Supabase project : eahlgydddmjebcfiskmz
#   S3 bucket        : staging.rackemleagues.com
#   CloudFront ID    : E1LHONENY2QXLN
#   AWS region       : us-east-1
# =====================================================================
name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_ENV: staging
          VITE_SUPABASE_URL: https://eahlgydddmjebcfiskmz.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Un-gate message push notifications on staging (off in production until
          # verified). VAPID public key is baked into the client bundle so the
          # subscribe flow works; set it in the `staging` GitHub Environment secrets.
          VITE_PUSH_NOTIFICATIONS: 'true'
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      # Guard: a duplicate migration version aborts the migration step below with
      # an opaque Postgres duplicate-key error, AFTER the build but BEFORE the S3
      # upload — leaving this environment silently serving its previous bundle.
      # Fail here instead, with a message that names the offending files.
      - name: Check for duplicate migration versions
        run: bash scripts/check-migration-versions.sh

      - name: Run Supabase migrations
        run: |
          supabase link --project-ref eahlgydddmjebcfiskmz
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref eahlgydddmjebcfiskmz
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://staging.rackemleagues.com --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ s3://staging.rackemleagues.com --delete --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id E1LHONENY2QXLN --paths "/*"

      - name: Deployment summary
        run: |
          echo "### ✅ Staging Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: staging.rackemleagues.com" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution**: E1LHONENY2QXLN" >> $GITHUB_STEP_SUMMARY

