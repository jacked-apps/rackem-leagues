# =====================================================================
# Pre-merge checks.
#
# The repo previously had NO pull_request-triggered workflow — the only
# automation was the two deploy workflows, which run after a merge to main.
# That meant a whole class of mistake could only be discovered by breaking a
# deployed environment.
#
# This workflow is the place for cheap, fast checks that should block a merge
# rather than a deploy. Add to it as more are found worth guarding.
#
# Jobs run in parallel and are independent:
#   migration-versions : duplicate migration version guard
#   unit-tests         : the vitest `unit` project (fast, no database)
#   db-tests           : the vitest `db` project against a real local Supabase
#   typecheck          : `pnpm run build` = tsc -b + vite build
# =====================================================================
name: Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  migration-versions:
    name: Migration versions are unique
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Two migrations sharing a version number merge cleanly in git (the
      # filenames differ) but can never both apply — schema_migrations is keyed
      # on the version alone. Caught here it is a renamed file; caught at deploy
      # it is a failed migration step that aborts the deploy before the S3
      # upload, silently leaving the environment on its previous bundle.
      - name: Check for duplicate migration versions
        run: bash scripts/check-migration-versions.sh

  whats-new:
    name: What's New entry or opt-out
    # PRs only — there's no description to read on a direct push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need the base commit to diff against; a shallow clone has neither.
          fetch-depth: 0

      # Written to files rather than passed as arguments: a PR description is
      # arbitrary user text, and interpolating it into a shell command is a
      # script-injection waiting to happen.
      - name: Collect changed files and PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt

      - name: Check for a What's New entry
        run: node scripts/check-whats-new.mjs /tmp/changed-files.txt /tmp/pr-body.txt

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `unit` project ONLY — it needs no database and should stay fast.
      # The `db` project runs in its own job below, which stands up a real
      # Supabase stack.
      - name: Run unit tests
        run: pnpm test:unit
        env:
          # Placeholders, NOT credentials. `src/supabaseClient.ts` reads these at
          # import time; with them unset the client is constructed with an
          # undefined URL, which resolves against happy-dom's default page origin
          # (http://localhost:3000) and every test file that transitively imports
          # the client dies at COLLECTION time with ECONNREFUSED — ~30 files, none
          # of which are really failing. Locally this is masked by a .env, which
          # is exactly why these tests passed on a developer machine and not here.
          # The tests mock supabase-js, so no request is ever made; the client
          # just needs a syntactically valid URL and a non-empty key to construct.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-tests

  db-tests:
    name: Database tests
    runs-on: ubuntu-latest
    # Slower than the other jobs — it boots Postgres, PostgREST and Auth — but
    # these tests were previously unrunnable in CI, which meant they only ever
    # ran when somebody remembered to run them locally. They didn't get run for
    # months, and drifted badly out from under the schema: a column changed
    # meaning, triggers were added that made an assertion impossible, and
    # fixtures the seed can no longer provide. None of it failed anything,
    # because nothing was looking. This job is what makes that visible on the
    # day it happens instead of a quarter later.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned rather than 'latest' so a CLI release can never turn this
          # job red on a branch that changed nothing.
          version: 2.117.0

      # Only what the tests actually reach for: Postgres (direct pg queries),
      # Kong + PostgREST (supabase-js), and Auth (authenticated clients).
      # Studio, storage, realtime, edge functions and the log pipeline are all
      # dead weight here — the two tests that mention realtime only read the
      # pg_publication catalog over SQL.
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,storage-api,realtime

      # `supabase start` applies migrations but seeds nothing, so the rows have
      # to be loaded explicitly.
      #
      # This is `database/dev_starting_point.sql`, the maintained dev seed —
      # deliberately NOT `supabase/seed.sql`, which references columns that
      # have since been dropped and fails partway through, leaving a
      # half-populated database. That file is being removed separately.
      #
      # It carries a guard refusing to run against anything but a database
      # named "postgres", which local Supabase satisfies.
      - name: Load seed data
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f database/dev_starting_point.sql

      # The dev seed creates dev@ and the three captain logins; these are the
      # four the suites name explicitly via TEST_USERS. Idempotent
      # (ON CONFLICT DO NOTHING), so running it alongside the dev seed is safe.
      - name: Ensure test users exist
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f supabase/seed_test_users.sql

      - name: Run database tests
        run: pnpm test:db
        env:
          # `src/supabaseClient.ts` builds a client at IMPORT time from these,
          # so every test file that transitively imports an app module dies at
          # collection without them — "supabaseUrl is required", nothing to do
          # with the database itself. The unit job passes placeholders because
          # it mocks supabase-js; here the calls are real, so these are the
          # actual local values. Not secrets: the anon key is the same demo key
          # `supabase start` prints and `src/test/dbTestUtils.ts` already
          # hardcodes, and it only ever addresses a throwaway local stack.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

  typecheck:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `build` is `tsc -b && vite build`, so this is the authoritative
      # typecheck as well as proof the bundle (and the service worker) still
      # compile. Deliberately catches type errors BEFORE a deploy tries to.
      - name: Build
        run: pnpm run build
